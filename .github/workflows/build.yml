name: PS5
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux toolchain image
        run: docker build -t prism-builder .
      - name: Lint and host tests
        run: docker run --rm -v "$PWD:/work" prism-builder make lint test
      - name: Render native previews
        run: docker run --rm -v "$PWD:/work" prism-builder make preview
      - name: Build the PS5 title
        run: docker run --rm -v "$PWD:/work" prism-builder make app
      - uses: actions/upload-artifact@v4
        with:
          name: prism-ps5
          path: |
            dist/PPSA99483.zip
            dist/SHA256SUMS
            build/preview/*.png
          if-no-files-found: error
